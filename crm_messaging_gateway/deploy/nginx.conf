server {
    listen 443 ssl;
    server_name messaging.example.invalid;
    ssl_certificate /etc/letsencrypt/live/messaging.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messaging.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log off;
    location = /webhooks/whatsapp/wa-callcenter {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }
    location / { return 404; }
}
