interface:
  display_name: "SQL Optimization Patterns"
  short_description: "Safe SQL diagnosis, EXPLAIN analysis, index and rewrite recommendations, and database health or security reviews for PostgreSQL, MySQL, and MariaDB."
  default_prompt: "Use $sql-optimization-patterns to diagnose this SQL issue and propose the safest fix."

policy:
  allow_implicit_invocation: true

