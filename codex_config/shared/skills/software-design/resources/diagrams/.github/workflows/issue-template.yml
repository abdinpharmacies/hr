name: Check issue template

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check issue template marker
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const markers = [
              '<!-- software-diagrams:bug-report -->',
              '<!-- software-diagrams:feature-request -->'
            ];

            if (markers.some((marker) => body.includes(marker))) {
              core.info('Issue was created from a supported issue form.');
              return;
            }

            const marker = '<!-- software-diagrams:template-check -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const alreadyNotified = comments.some((comment) => comment.body?.includes(marker));

            if (!alreadyNotified) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\nPlease edit this issue using one of the repository's issue forms: **Bug report** or **Feature request**. This check will pass after the issue is updated with a supported template.`
              });
            }

            core.setFailed('This issue does not contain a supported issue-template marker.');
