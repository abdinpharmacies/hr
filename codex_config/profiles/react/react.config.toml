# Active workflow profile: react

# REACT GUIDELINES

## Language & Tooling

- TypeScript-first for new projects.
- Prefer function components and hooks over class components.
- Use modern JSX/ESM conventions consistent with the project's bundler (Vite, Next.js, etc.).

## Component Modeling

- Prefer small, focused components over monolithic ones. Model reusable UI as components, not ad-hoc inline markup.
- Keep component files focused; extract reusable pieces into their own files.
- Use `const`/memoization judiciously; avoid premature optimization.

## State & Effects

- Favor local state and derived values; lift state only when genuinely shared.
- Use hooks correctly (dependencies arrays, cleanup). Avoid `useEffect` for derived state when a direct computation suffices.

## Styling

- Follow the project's established styling approach (CSS modules, Tailwind, CSS-in-JS) rather than introducing a new system.

## Dependencies & Versions

- Never guess package versions. Before adding a package, perform a live web search to retrieve the absolute latest stable version.
- Avoid adding a dependency when platform or existing project utilities suffice.

## Code Quality

- Clean code: single responsibility principle and DRY.
- Use clear, descriptive, accurate naming.

## Comments Rule

- Do NOT add comments to code unless the user explicitly asks.


# Architecture

- Prefer small, single-responsibility components over monolithic files; extract reusable pieces into their own files.
- Prefer composition over configuration: avoid boolean-prop proliferation; use compound components with shared context when an API grows complex.
- Lift state only when genuinely shared between siblings; keep state local otherwise.
- Preserve the existing architecture when modifying code; review the codebase structure before adding new files.
- Avoid premature abstraction — extract a pattern only after it genuinely repeats.
- Do not introduce a dependency when existing utilities or platform APIs suffice.
- Follow the project's established conventions (file layout, naming, component API style).

# TypeScript

- TypeScript-first for all new code; avoid `any` and avoid silencing strict-mode errors with casts.
- Use `interface` for props and object shapes, `type` for unions and derived types.
- Type event handlers, refs, and hook return values explicitly; don't leak implicit types across boundaries.
- Prefer `as const` for static configuration and discriminated unions for complex state over nullable fields.
- Keep types colocated with usage; extract shared types to dedicated files only when reused.
- Never guess package versions or typings; verify against documentation before adding anything new.

# Performance

- Eliminate waterfalls first: run independent async work with `Promise.all()` and defer awaits until the point of use.
- Keep the initial bundle lean: import directly (avoid barrel files) and dynamically import heavy or rarely-used components.
- Defer third-party scripts (analytics, logging, chat) until after hydration.
- Keep input responsive with `useDeferredValue` or `startTransition` for non-urgent updates.
- Derive state during render rather than syncing it through `useEffect`.
- Memoize only when a profile shows meaningful render cost; avoid premature optimization.
- Hoist static objects (Intl formatters, RegExps, constants) out of render and loops.
- When a decision needs detail or Next.js specifics, load the `react-best-practices` skill instead of approximating.

# UI & Accessibility

- Prefer semantic HTML (`<nav>`, `<button>`, `<main>`, `<label>`) over generic `<div>`; never attach click handlers to non-interactive elements.
- Every interactive element needs a visible focus indicator and keyboard handler; form inputs need an associated `<label>` or `aria-label`.
- Provide `alt` text on meaningful images and `alt=""` on decorative ones; specify image dimensions to avoid layout shift.
- Maintain WCAG AA color contrast; never rely on color alone to convey meaning.
- Respect `prefers-reduced-motion`; keep animations short and compositor-friendly (transform/opacity).
- Add state attributes (`aria-current`, `aria-expanded`) where they aid navigation; use `aria-live` sparingly.

# Agent Workflow

- Inspect the existing code and its architecture before changing it; prefer editing existing files over creating new ones.
- Follow established conventions (framework, styling system, imports, naming); do not introduce a parallel style.
- Make small, incremental, focused changes; run the project's typecheck/lint/build to verify each step before moving on.
- Never guess APIs, import paths, or package versions — check the codebase or documentation first.
- Prefer the simplest fix that fits existing patterns; avoid extra dependencies and speculative abstraction.
- Ask the user when requirements are ambiguous or a change would be large, rather than assuming.
- Do not add code comments unless explicitly requested.
- Keep web-project work web-only: avoid React Native, mobile, or platform-specific patterns in React web code.
- Do not duplicate knowledge from skills into always-loaded rules; use skills and their references for detail.
'''

